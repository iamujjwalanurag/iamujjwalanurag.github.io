<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Ad Intelligence</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: #e5e7eb;
      margin: 0;
      padding: 20px;
    }

    h1 {
      text-align: center;
      color: #38bdf8;
    }

    .container {
      max-width: 900px;
      margin: auto;
    }

    .card {
      background: #020617;
      border-radius: 10px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 0 20px rgba(0,0,0,0.4);
    }

    label {
      display: block;
      margin-top: 10px;
      font-size: 14px;
    }

    input, select {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      border-radius: 6px;
      border: none;
      outline: none;
    }

    button {
      margin-top: 15px;
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 6px;
      background: #38bdf8;
      color: #020617;
      font-weight: bold;
      cursor: pointer;
    }

    .metrics {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 15px;
    }

    .metric {
      background: #020617;
      padding: 15px;
      border-radius: 8px;
      text-align: center;
    }

    .metric h3 {
      margin: 5px 0;
      color: #38bdf8;
    }

    .insight {
      margin-top: 10px;
      padding: 10px;
      background: #020617;
      border-left: 4px solid #38bdf8;
      border-radius: 5px;
    }

    .score {
      font-size: 32px;
      font-weight: bold;
      color: #22c55e;
    }
  </style>
</head>

<body>

<div class="container">
  <h1>Ad Performance Intelligence MVP</h1>

  <!-- Campaign Input -->
  <div class="card">
    <h2>Add Campaign Data</h2>

    <label>Platform</label>
    <select id="platform">
      <option>Google Ads</option>
      <option>Meta Ads</option>
      <option>LinkedIn Ads</option>
    </select>

    <label>Ad Spend (₹)</label>
    <input type="number" id="spend">

    <label>Impressions</label>
    <input type="number" id="impressions">

    <label>Clicks</label>
    <input type="number" id="clicks">

    <label>Leads / Sales</label>
    <input type="number" id="leads">

    <button onclick="analyze()">Analyze Campaign</button>
  </div>

  <!-- Dashboard -->
  <div class="card">
    <h2>Dashboard</h2>

    <div class="metrics">
      <div class="metric">
        <p>CPC</p>
        <h3 id="cpc">₹0</h3>
      </div>
      <div class="metric">
        <p>CPL</p>
        <h3 id="cpl">₹0</h3>
      </div>
      <div class="metric">
        <p>CTR</p>
        <h3 id="ctr">0%</h3>
      </div>
      <div class="metric">
        <p>ROI Score</p>
        <div class="score" id="roiScore">0</div>
      </div>
    </div>

    <div id="insights"></div>
  </div>
</div>

<script>
  function analyze() {
    const spend = Number(document.getElementById("spend").value);
    const impressions = Number(document.getElementById("impressions").value);
    const clicks = Number(document.getElementById("clicks").value);
    const leads = Number(document.getElementById("leads").value);

    if (!spend || !impressions || !clicks) {
      alert("Please fill all required fields");
      return;
    }

    const cpc = spend / clicks;
    const cpl = leads ? spend / leads : spend;
    const ctr = (clicks / impressions) * 100;

    // ROI Score (simple logic)
    let score = 100;
    if (ctr < 1) score -= 30;
    if (cpc > 20) score -= 20;
    if (leads === 0) score -= 30;

    score = Math.max(score, 10);

    document.getElementById("cpc").innerText = "₹" + cpc.toFixed(2);
    document.getElementById("cpl").innerText = "₹" + cpl.toFixed(2);
    document.getElementById("ctr").innerText = ctr.toFixed(2) + "%";
    document.getElementById("roiScore").innerText = score;

    const insights = document.getElementById("insights");
    insights.innerHTML = "";

    if (ctr < 1) addInsight("Low CTR detected. Improve creatives & messaging.");
    if (cpc > 20) addInsight("High CPC. Narrow audience targeting.");
    if (leads === 0) addInsight("No conversions. Check landing page.");
    if (score > 70) addInsight("Campaign is performing well. Scale gradually.");
  }

  function addInsight(text) {
    const div = document.createElement("div");
    div.className = "insight";
    div.innerText = text;
    document.getElementById("insights").appendChild(div);
  }
</script>

</body>
</html>
