<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Ad Intelligence</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
  body {
    margin: 0;
    font-family: system-ui, -apple-system, sans-serif;
    background: radial-gradient(circle at top, #020617, #000);
    color: #e5e7eb;
  }

  .app {
    max-width: 1100px;
    margin: auto;
    padding: 30px;
  }

  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .version {
    font-size: 14px;
    color: #38bdf8;
    border: 1px solid #38bdf8;
    padding: 6px 12px;
    border-radius: 999px;
  }

  h1 {
    font-size: 36px;
    margin: 20px 0 5px;
  }

  .subtitle {
    color: #94a3b8;
    margin-bottom: 30px;
  }

  .card {
    background: #020617;
    border-radius: 14px;
    padding: 20px;
    margin-bottom: 20px;
    box-shadow: 0 30px 80px rgba(0,0,0,.5);
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 20px;
  }

  input {
    width: 100%;
    padding: 12px;
    background: #000;
    color: #fff;
    border-radius: 8px;
    border: 1px solid #1e293b;
  }

  button {
    margin-top: 15px;
    padding: 14px;
    width: 100%;
    border-radius: 10px;
    border: none;
    background: linear-gradient(90deg, #38bdf8, #22c55e);
    font-weight: bold;
    cursor: pointer;
  }

  .score {
    font-size: 72px;
    font-weight: 800;
    text-align: center;
    margin: 20px 0;
    background: linear-gradient(90deg, #38bdf8, #22c55e);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .decision {
    text-align: center;
    font-size: 18px;
    margin-bottom: 10px;
  }

  .insight {
    background: #000;
    padding: 12px;
    border-left: 4px solid #38bdf8;
    border-radius: 8px;
    margin-top: 10px;
  }
</style>
</head>

<body>
<div class="app">

  <div class="header">
    <div>
      <h1>Ad Engine</h1>
      <div class="subtitle">Adaptive Intelligence System</div>
    </div>
    <div class="version">v∞</div>
  </div>

  <!-- INPUT -->
  <div class="card">
    <h3>Campaign Input</h3>
    <div class="grid">
      <input id="spend" placeholder="Ad Spend (₹)">
      <input id="impressions" placeholder="Impressions">
      <input id="clicks" placeholder="Clicks">
      <input id="leads" placeholder="Leads / Sales">
    </div>
    <button onclick="runEngine()">Run Intelligence</button>
  </div>

  <!-- OUTPUT -->
  <div class="card">
    <div class="score" id="score">—</div>
    <div class="decision" id="decision">Waiting for data</div>
    <div id="insights"></div>
  </div>

</div>

<script>
/* ===============================
   ENGINE REGISTRY (∞ READY)
================================ */
const engines = [
  efficiencyEngine,
  conversionEngine,
  realityCheckEngine
];

/* ===============================
   CORE RUNNER
================================ */
function runEngine() {
  const data = {
    spend: +spend.value,
    impressions: +impressions.value,
    clicks: +clicks.value,
    leads: +leads.value
  };

  let totalScore = 0;
  let insights = [];

  engines.forEach(engine => {
    const result = engine(data);
    totalScore += result.score;
    insights.push(result.message);
  });

  totalScore = Math.min(Math.round(totalScore), 100);

  document.getElementById("score").innerText = totalScore;
  document.getElementById("decision").innerText = decisionText(totalScore);

  const insightBox = document.getElementById("insights");
  insightBox.innerHTML = "";
  insights.forEach(msg => {
    const div = document.createElement("div");
    div.className = "insight";
    div.innerText = msg;
    insightBox.appendChild(div);
  });
}

/* ===============================
   ENGINES (ADD FOREVER ♾️)
================================ */

function efficiencyEngine(d) {
  const ctr = (d.clicks / d.impressions) * 100 || 0;
  if (ctr < 1)
    return { score: 20, message: "Creative efficiency is weak." };
  return { score: 35, message: "Creative efficiency is healthy." };
}

function conversionEngine(d) {
  if (d.leads === 0)
    return { score: 15, message: "No conversions detected." };
  return { score: 35, message: "Conversion flow is working." };
}

function realityCheckEngine(d) {
  if (d.spend > 0 && d.leads === 0)
    return { score: 0, message: "Spend without results detected." };
  return { score: 30, message: "Spend is justified by outcomes." };
}

/* ===============================
   DECISION LAYER
================================ */
function decisionText(score) {
  if (score >= 85) return "🚀 Auto-scale recommended";
  if (score >= 65) return "📈 Optimize & scale";
  if (score >= 45) return "⚠️ Fix critical issues";
  return "❌ Stop or rebuild campaign";
}
</script>

</body>
</html>
